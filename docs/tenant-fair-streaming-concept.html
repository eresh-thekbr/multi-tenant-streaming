<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tenant-Fair Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one column control board. A shared event source on top feeds two stacked pipelines with the identical stream. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#14202B; --muted:#5B6B79; --line:#D5DBE1;
  --acme:#D9501F; --globex:#0B8A84; --initech:#4650C4; --chip-ink:#FFFFFF;
  --good:#0B7A75; --bad:#C23B1B;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --surface:#161E26; --ink:#E6ECF1; --muted:#8FA0AE; --line:#2A3641;
    --acme:#FF7A4D; --globex:#34C9C1; --initech:#8E98FF; --chip-ink:#0E1419;
    --good:#34C9C1; --bad:#FF8A66; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --surface:#161E26; --ink:#E6ECF1; --muted:#8FA0AE; --line:#2A3641;
  --acme:#FF7A4D; --globex:#34C9C1; --initech:#8E98FF; --chip-ink:#0E1419;
  --good:#34C9C1; --bad:#FF8A66; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1.2;margin:0}
.lede{margin:6px 0 0;color:var(--muted)}
.label{font:500 11px/1.2 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.t-acme{--c:var(--acme)} .t-globex{--c:var(--globex)} .t-initech{--c:var(--initech)}

.source{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.strip{display:flex;gap:4px;justify-content:flex-end;overflow:hidden;min-width:0;padding:6px;border:1px dashed var(--line);border-radius:8px;min-height:36px;-webkit-mask-image:linear-gradient(to right,transparent,#000 28px);mask-image:linear-gradient(to right,transparent,#000 28px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin-top:-10px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:500 14px/1 var(--font-body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:2px solid var(--globex);outline-offset:2px}
.time{flex:1;min-width:160px;display:flex;flex-direction:column;gap:6px}
.track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink)}

.verdict{display:flex;flex-wrap:wrap;gap:10px 40px;align-items:flex-end}
.verdict .head{flex-basis:100%}
.verdict .item{display:flex;flex-direction:column;gap:4px}
.verdict .n{font:700 clamp(30px,7vw,44px)/1 var(--font-display);font-variant-numeric:tabular-nums}
.bad{color:var(--bad)} .good{color:var(--good)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:flex-start}
.panel-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:64px}
.stat .nm{display:inline-flex;align-items:center;gap:6px;font:500 11px/1.2 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .nm i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.stat b{font:500 17px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}

.cols,.lane{display:grid;grid-template-columns:64px minmax(0,1fr) 56px 52px;gap:8px;align-items:center}
.lane{padding-top:10px;border-top:1px solid var(--line)}
.lane-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.lane-name b{font-weight:500}
.lane-name small{color:var(--muted);font-size:11px;font-family:var(--font-mono)}
.queue{display:flex;flex-direction:row-reverse;justify-content:flex-start;gap:3px;overflow:hidden;min-width:0;padding:6px;background:var(--bg);border-radius:6px;min-height:36px;-webkit-mask-image:linear-gradient(to right,transparent,#000 24px);mask-image:linear-gradient(to right,transparent,#000 24px)}
.worker{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:36px}
.worker.idle{color:var(--muted);font:400 11px var(--font-mono)}
.bar{display:block;width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .25s linear}
.graph{font:500 12px/1.35 var(--font-mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
.graph span{display:flex;justify-content:space-between;gap:6px}
.graph em{font-style:normal;color:var(--c)}
.graph.one{font-size:18px}

.chip{display:inline-grid;place-items:center;flex:none;width:22px;height:22px;border-radius:5px;background:var(--c);color:var(--chip-ink);font:500 11px/1 var(--font-mono);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.chip{animation:none}.bar i{transition:none}}
.foot{color:var(--muted);font-size:13px;margin:0}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
var h = React.createElement;
var TICK_MS = 250, TICK_S = 0.25, END = 200, P_SPAWN = 0.45;
var TENANTS = [
  {id: 'acme', letter: 'A', cost: 5},
  {id: 'globex', letter: 'G', cost: 1},
  {id: 'initech', letter: 'I', cost: 1}
];
var BY_ID = {};
TENANTS.forEach(function (t) { BY_ID[t.id] = t; });

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function zero() { return {acme: 0, globex: 0, initech: 0}; }
function lists() { return {acme: [], globex: [], initech: []}; }

function createSim() {
  return {
    t: 0, nextId: 1, rng: mulberry32(11), recent: [],
    naive: {q: [], w: null, done: zero(), waits: lists()},
    staged: {q: lists(), w: {acme: null, globex: null, initech: null}, done: zero(), waits: lists()}
  };
}
function pickTenant(r) { return r < 0.7 ? 'acme' : (r < 0.9 ? 'globex' : 'initech'); }

function advance(w, queue, done, waits, t) {
  if (w) {
    w.left -= 1;
    if (w.left <= 0) { done[w.ev.tenant] += 1; w = null; }
  }
  if (!w && queue.length) {
    var ev = queue.shift();
    waits[ev.tenant].push(t - ev.born);
    var cost = BY_ID[ev.tenant].cost;
    w = {ev: ev, left: cost, cost: cost};
  }
  return w;
}

function step(s) {
  s.t += 1;
  if (s.rng() < P_SPAWN) {
    var tenant = pickTenant(s.rng());
    var ev = {id: s.nextId++, tenant: tenant, born: s.t};
    s.naive.q.push(ev);
    s.staged.q[tenant].push(ev);
    s.recent.push(ev);
    if (s.recent.length > 14) s.recent.shift();
  }
  s.naive.w = advance(s.naive.w, s.naive.q, s.naive.done, s.naive.waits, s.t);
  TENANTS.forEach(function (T) {
    s.staged.w[T.id] = advance(s.staged.w[T.id], s.staged.q[T.id], s.staged.done, s.staged.waits, s.t);
  });
}

function avg(list, n) {
  var a = list.slice(-n);
  if (!a.length) return null;
  return a.reduce(function (x, y) { return x + y; }, 0) / a.length;
}
function smallAvg(waits) {
  var a = waits.globex.slice(-6).concat(waits.initech.slice(-6));
  if (!a.length) return null;
  return a.reduce(function (x, y) { return x + y; }, 0) / a.length;
}
function fmt(v) { return v == null ? '—' : (v * TICK_S).toFixed(1) + ' s'; }

/*UI*/
function Chip(p) {
  return h('span', {className: 'chip t-' + p.ev.tenant, title: p.ev.tenant + ' event #' + p.ev.id}, BY_ID[p.ev.tenant].letter);
}

function Worker(p) {
  var w = p.w;
  if (!w) return h('div', {className: 'worker idle'}, 'idle');
  var pct = Math.min(100, (w.cost - w.left + 0.6) / w.cost * 100);
  return h('div', {className: 'worker t-' + w.ev.tenant},
    h(Chip, {key: w.ev.id, ev: w.ev}),
    h('span', {className: 'bar'}, h('i', {style: {width: pct + '%'}})));
}

function Lane(p) {
  return h('div', {className: 'lane'},
    h('div', {className: 'lane-name'}, h('b', null, p.name), h('small', null, p.queue.length + ' queued')),
    h('div', {className: 'queue'}, p.queue.slice(0, 14).map(function (ev) { return h(Chip, {key: ev.id, ev: ev}); })),
    h(Worker, {w: p.w}),
    p.graph);
}

function Cols() {
  return h('div', {className: 'cols'},
    h('span', {className: 'label'}, 'Lane'),
    h('span', {className: 'label'}, 'Kafka queue, next on the right'),
    h('span', {className: 'label'}, 'Worker'),
    h('span', {className: 'label'}, 'Graph'));
}

function Stats(p) {
  return h('div', {className: 'stats'}, TENANTS.map(function (T) {
    return h('div', {key: T.id, className: 'stat t-' + T.id},
      h('span', {className: 'nm'}, h('i'), T.id),
      h('b', null, fmt(avg(p.waits[T.id], 6))));
  }));
}

function Naive(p) {
  var n = p.s.naive;
  var graph = h('div', {className: 'graph'}, TENANTS.map(function (T) {
    return h('span', {key: T.id, className: 't-' + T.id}, h('em', null, T.letter), n.done[T.id]);
  }));
  return h('section', {className: 'panel'},
    h('div', {className: 'panel-head'},
      h('div', null, h('h2', null, 'Naive: one shared line'), h('p', null, 'Everyone waits behind acme.')),
      h('div', null, h('div', {className: 'label'}, 'Avg wait'), h(Stats, {waits: n.waits}))),
    h(Cols),
    h(Lane, {name: 'Shared', queue: n.q, w: n.w, graph: graph}));
}

function Staged(p) {
  var g = p.s.staged;
  return h('section', {className: 'panel'},
    h('div', {className: 'panel-head'},
      h('div', null, h('h2', null, 'Staged: one lane per tenant'), h('p', null, 'The dispatcher splits by tenant. One worker per lane keeps order.')),
      h('div', null, h('div', {className: 'label'}, 'Avg wait'), h(Stats, {waits: g.waits}))),
    h(Cols),
    TENANTS.map(function (T) {
      var graph = h('div', {className: 'graph one t-' + T.id}, h('span', null, h('em', null, T.letter), g.done[T.id]));
      return h(Lane, {key: T.id, name: T.id, queue: g.q[T.id], w: g.w[T.id], graph: graph});
    }));
}

function App() {
  var simRef = React.useRef(null);
  if (!simRef.current) {
    simRef.current = createSim();
    for (var i = 0; i < 30; i++) step(simRef.current);
  }
  var force = React.useReducer(function (x) { return x + 1; }, 0)[1];
  var playingState = React.useState(true);
  var playing = playingState[0], setPlaying = playingState[1];
  var s = simRef.current;
  var finished = s.t >= END;

  React.useEffect(function () {
    if (!playing) return;
    var id = setInterval(function () {
      var sim = simRef.current;
      if (sim.t >= END) { setPlaying(false); return; }
      step(sim);
      force();
    }, TICK_MS);
    return function () { clearInterval(id); };
  }, [playing]);

  function onPlay() {
    if (finished) { simRef.current = createSim(); for (var i = 0; i < 6; i++) step(simRef.current); force(); }
    setPlaying(!playing || finished ? true : false);
  }
  function onRestart() {
    simRef.current = createSim();
    for (var i = 0; i < 6; i++) step(simRef.current);
    setPlaying(true);
    force();
  }

  var nw = smallAvg(s.naive.waits), sw = smallAvg(s.staged.waits);
  var label = finished ? 'Replay' : (playing ? 'Pause' : 'Play');

  return h('div', {className: 'wrap'},
    h('header', null,
      h('h1', null, 'Tenant-Fair Streaming'),
      h('p', {className: 'lede'}, 'The same events go into two pipelines. Watch what globex and initech wait for.')),

    h('div', null,
      h('div', {className: 'source'},
        h('span', {className: 'label'}, '1 CDC events'),
        h('div', {className: 'strip'}, s.recent.map(function (ev) { return h(Chip, {key: ev.id, ev: ev}); })),
        h('span', {className: 'label'}, '2 Kafka →'))),
    h('div', {className: 'legend'}, TENANTS.map(function (T) {
      var note = T.id === 'acme' ? 'big and slow (70% of events)' : (T.id === 'globex' ? 'small (20%)' : 'small (10%)');
      return h('span', {key: T.id, className: 't-' + T.id}, h(Chip, {ev: {tenant: T.id, id: T.letter}}), T.id + ', ' + note);
    })),

    h('div', {className: 'controls'},
      h('button', {id: 'play', type: 'button', onClick: onPlay}, label),
      h('button', {id: 'restart', type: 'button', className: 'ghost', onClick: onRestart}, 'Restart'),
      h('div', {className: 'time'},
        h('span', {className: 'label'}, (s.t * TICK_S).toFixed(0) + ' s of ' + (END * TICK_S) + ' s, simulated'),
        h('div', {className: 'track'}, h('i', {style: {width: Math.min(100, s.t / END * 100) + '%'}})))),

    h('section', {className: 'verdict'},
      h('div', {className: 'head label'}, 'Small tenants (globex, initech) average wait'),
      h('div', {className: 'item'}, h('span', {className: 'label'}, 'Shared line'), h('span', {className: 'n bad'}, fmt(nw))),
      h('div', {className: 'item'}, h('span', {className: 'label'}, 'Own lane'), h('span', {className: 'n good'}, fmt(sw)))),

    h(Naive, {s: s}),
    h(Staged, {s: s}),

    h('p', {className: 'foot'}, '3 and 4: lanes and workers. 5: every finished event updates the knowledge graph (the Graph column). In this demo an acme event takes 5 ticks and the others take 1. Same idea as the Python PoC.'));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>

</body></html>
