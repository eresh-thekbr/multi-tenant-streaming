<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" color="#1b2230" font-family="'IBM Plex Sans', Helvetica, Arial, sans-serif" viewBox="0 0 1240 540" role="img" aria-label="Three tenant voice agents publish to one Kafka topic. The event source polls it and routes each event into its tenant's bounded lane. A round-robin scheduler hands events to four workers, one account at a time. The reliable processor checks idempotency, runs the handler up to three times, and either updates account state or sends the event to the dead-letter topic. Completed events release their offsets, and the lowest in-progress offset is committed back to Kafka. A full lane makes intake wait.">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
        </marker>
        <marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#2456c9"/>
        </marker>
        <marker id="ahD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#b8322a"/>
        </marker>
      </defs>
      <rect x="0" y="0" width="1240" height="540" fill="#f6f7f9"/>

            <g font-size="10.5" fill="#5d6676" letter-spacing="1.2" text-anchor="middle">
        <text x="95" y="30">TENANTS</text>
        <text x="305" y="30">KAFKA</text>
        <text x="515" y="30">INTAKE</text>
        <text x="735" y="30">TENANT LANES</text>
        <text x="925" y="30">DISPATCH</text>
        <text x="1135" y="30">PROCESSING</text>
      </g>

            <g font-size="13">
        <rect x="20" y="110" width="150" height="56" rx="7" fill="#ffffff" stroke="#7a4fd0" stroke-width="1.5"/>
        <text x="95" y="134" text-anchor="middle" fill="currentColor" font-weight="600">Credit Card agent</text>
        <text x="95" y="153" text-anchor="middle" fill="#5d6676" font-size="11.5">70% of traffic</text>
        <rect x="20" y="190" width="150" height="56" rx="7" fill="#ffffff" stroke="#1f8a6a" stroke-width="1.5"/>
        <text x="95" y="214" text-anchor="middle" fill="currentColor" font-weight="600">Auto Loan agent</text>
        <text x="95" y="233" text-anchor="middle" fill="#5d6676" font-size="11.5">20% of traffic</text>
        <rect x="20" y="270" width="150" height="56" rx="7" fill="#ffffff" stroke="#c27a12" stroke-width="1.5"/>
        <text x="95" y="294" text-anchor="middle" fill="currentColor" font-weight="600">Personal Loan agent</text>
        <text x="95" y="313" text-anchor="middle" fill="#5d6676" font-size="11.5">10% of traffic</text>
      </g>
      <g stroke="currentColor" stroke-width="1.3" fill="none">
        <line x1="170" y1="138" x2="223" y2="160" marker-end="url(#ah)"/>
        <line x1="170" y1="218" x2="223" y2="218" marker-end="url(#ah)"/>
        <line x1="170" y1="298" x2="223" y2="276" marker-end="url(#ah)"/>
      </g>
      <text x="197" y="98" text-anchor="middle" font-size="11" fill="#5d6676">publish</text>
      <text x="197" y="111" text-anchor="middle" font-size="11" fill="#5d6676">turns</text>

            <rect x="225" y="90" width="160" height="260" rx="8" fill="#ffffff" stroke="currentColor" stroke-width="1.3"/>
      <text x="305" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">One shared topic</text>
      <text x="305" y="131" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" fill="#5d6676">key = account_id</text>
      <g font-size="10.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" fill="#5d6676">
        <rect x="241" y="146" width="128" height="40" rx="4" fill="none" stroke="#c9cfd9"/>
        <text x="249" y="160">P0</text>
        <rect x="241" y="196" width="128" height="40" rx="4" fill="none" stroke="#c9cfd9"/>
        <text x="249" y="210">P1</text>
        <rect x="241" y="246" width="128" height="40" rx="4" fill="none" stroke="#c9cfd9"/>
        <text x="249" y="260">P2</text>
        <text x="305" y="312" text-anchor="middle">… PN</text>
        <text x="305" y="336" text-anchor="middle" font-size="9.5">tenants mixed per partition</text>
      </g>
            <g>
        <rect x="249" y="166" width="12" height="12" rx="2" fill="#7a4fd0"/><rect x="265" y="166" width="12" height="12" rx="2" fill="#7a4fd0"/>
        <rect x="281" y="166" width="12" height="12" rx="2" fill="#1f8a6a"/><rect x="297" y="166" width="12" height="12" rx="2" fill="#7a4fd0"/>
        <rect x="313" y="166" width="12" height="12" rx="2" fill="#7a4fd0"/><rect x="329" y="166" width="12" height="12" rx="2" fill="#c27a12"/>
        <rect x="249" y="216" width="12" height="12" rx="2" fill="#7a4fd0"/><rect x="265" y="216" width="12" height="12" rx="2" fill="#1f8a6a"/>
        <rect x="281" y="216" width="12" height="12" rx="2" fill="#7a4fd0"/><rect x="297" y="216" width="12" height="12" rx="2" fill="#7a4fd0"/>
        <rect x="313" y="216" width="12" height="12" rx="2" fill="#7a4fd0"/>
        <rect x="249" y="266" width="12" height="12" rx="2" fill="#c27a12"/><rect x="265" y="266" width="12" height="12" rx="2" fill="#7a4fd0"/>
        <rect x="281" y="266" width="12" height="12" rx="2" fill="#7a4fd0"/><rect x="297" y="266" width="12" height="12" rx="2" fill="#1f8a6a"/>
        <rect x="313" y="266" width="12" height="12" rx="2" fill="#7a4fd0"/><rect x="329" y="266" width="12" height="12" rx="2" fill="#7a4fd0"/>
      </g>

            <line x1="385" y1="218" x2="428" y2="218" stroke="currentColor" stroke-width="1.3" marker-end="url(#ah)"/>
      <text x="406" y="208" text-anchor="middle" font-size="11" fill="#5d6676">poll</text>
      <rect x="430" y="150" width="170" height="136" rx="8" fill="#ffffff" stroke="currentColor" stroke-width="1.3"/>
      <text x="515" y="174" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Kafka event source</text>
      <g font-size="11.5" fill="#5d6676" text-anchor="middle">
        <text x="515" y="200">poll every 500 ms</text>
        <text x="515" y="220">decode JSON event</text>
        <text x="515" y="240">track partition + offset</text>
        <text x="515" y="266" font-size="10.5">malformed: skip, release offset</text>
      </g>

            <g stroke="currentColor" stroke-width="1.3" fill="none">
        <path d="M600,200 C630,200 630,138 658,138" marker-end="url(#ah)"/>
        <line x1="600" y1="218" x2="658" y2="218" marker-end="url(#ah)"/>
        <path d="M600,236 C630,236 630,298 658,298" marker-end="url(#ah)"/>
      </g>
      <text x="630" y="335" text-anchor="middle" font-size="11" fill="#5d6676">route by</text>
      <text x="630" y="349" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" fill="#5d6676">tenant_id</text>

            <g font-size="12.5">
        <rect x="660" y="110" width="150" height="56" rx="7" fill="#ffffff" stroke="#7a4fd0" stroke-width="1.5"/>
        <text x="672" y="131" fill="currentColor" font-weight="600">Credit Card lane</text>
        <rect x="672" y="142" width="126" height="12" rx="2" fill="none" stroke="#c9cfd9"/>
        <rect x="672" y="142" width="104" height="12" rx="2" fill="#7a4fd0" opacity=".75"/>
        <rect x="660" y="190" width="150" height="56" rx="7" fill="#ffffff" stroke="#1f8a6a" stroke-width="1.5"/>
        <text x="672" y="211" fill="currentColor" font-weight="600">Auto Loan lane</text>
        <rect x="672" y="222" width="126" height="12" rx="2" fill="none" stroke="#c9cfd9"/>
        <rect x="672" y="222" width="18" height="12" rx="2" fill="#1f8a6a" opacity=".75"/>
        <rect x="660" y="270" width="150" height="56" rx="7" fill="#ffffff" stroke="#c27a12" stroke-width="1.5"/>
        <text x="672" y="291" fill="currentColor" font-weight="600">Personal Loan lane</text>
        <rect x="672" y="302" width="126" height="12" rx="2" fill="none" stroke="#c9cfd9"/>
        <rect x="672" y="302" width="10" height="12" rx="2" fill="#c27a12" opacity=".75"/>
      </g>
      <text x="735" y="349" text-anchor="middle" font-size="10.5" fill="#5d6676">bounded: 2,000 events each</text>

            <path d="M735,110 L735,62 L515,62 L515,148" fill="none" stroke="#2456c9" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahA)"/>
      <text x="625" y="54" text-anchor="middle" font-size="11" fill="#2456c9">lane full: intake waits (backpressure)</text>

            <g stroke="#2456c9" stroke-width="1.4" fill="none">
        <line x1="810" y1="138" x2="858" y2="160" marker-end="url(#ahA)"/>
        <line x1="810" y1="218" x2="858" y2="218" marker-end="url(#ahA)"/>
        <line x1="810" y1="298" x2="858" y2="276" marker-end="url(#ahA)"/>
      </g>
      <rect x="860" y="110" width="130" height="216" rx="8" fill="#ffffff" stroke="#2456c9" stroke-width="1.8"/>
      <text x="925" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Fair scheduler</text>
      <text x="925" y="150" text-anchor="middle" font-size="11" fill="#5d6676">round-robin lanes</text>
      <text x="925" y="165" text-anchor="middle" font-size="11" fill="#5d6676">1 worker per account</text>
      <g font-size="11" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" text-anchor="middle">
        <rect x="876" y="180" width="98" height="26" rx="5" fill="none" stroke="#c9cfd9"/><text x="925" y="197" fill="currentColor">worker 1</text>
        <rect x="876" y="214" width="98" height="26" rx="5" fill="none" stroke="#c9cfd9"/><text x="925" y="231" fill="currentColor">worker 2</text>
        <rect x="876" y="248" width="98" height="26" rx="5" fill="none" stroke="#c9cfd9"/><text x="925" y="265" fill="currentColor">worker 3</text>
        <rect x="876" y="282" width="98" height="26" rx="5" fill="none" stroke="#c9cfd9"/><text x="925" y="299" fill="currentColor">worker 4</text>
      </g>

            <line x1="990" y1="218" x2="1038" y2="218" stroke="currentColor" stroke-width="1.3" marker-end="url(#ah)"/>
      <text x="1014" y="208" text-anchor="middle" font-size="11" fill="#5d6676">process</text>
      <rect x="1040" y="110" width="190" height="216" rx="8" fill="#ffffff" stroke="currentColor" stroke-width="1.3"/>
      <text x="1135" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Reliable processor</text>
      <g font-size="11.5">
        <rect x="1054" y="146" width="162" height="44" rx="5" fill="none" stroke="#c9cfd9"/>
        <text x="1064" y="164" fill="currentColor">event_id seen before?</text>
        <text x="1064" y="181" fill="#5d6676" font-size="10.5">yes: skip as duplicate</text>
        <line x1="1135" y1="190" x2="1135" y2="202" stroke="currentColor" marker-end="url(#ah)"/>
        <rect x="1054" y="204" width="162" height="44" rx="5" fill="none" stroke="#c9cfd9"/>
        <text x="1064" y="222" fill="currentColor">run handler</text>
        <text x="1064" y="239" fill="#5d6676" font-size="10.5">up to 3 attempts</text>
        <line x1="1135" y1="248" x2="1135" y2="260" stroke="currentColor" marker-end="url(#ah)"/>
        <rect x="1054" y="262" width="162" height="44" rx="5" fill="none" stroke="#c9cfd9"/>
        <text x="1064" y="280" fill="currentColor">record event_id</text>
        <text x="1064" y="297" fill="#5d6676" font-size="10.5">only after success</text>
      </g>

            <line x1="1170" y1="326" x2="1170" y2="388" stroke="currentColor" stroke-width="1.3" marker-end="url(#ah)"/>
      <text x="1178" y="362" font-size="11" fill="#5d6676">apply</text>
      <rect x="1060" y="390" width="170" height="78" rx="8" fill="#ffffff" stroke="currentColor" stroke-width="1.3"/>
      <text x="1145" y="412" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Account state</text>
      <g font-size="11" fill="#5d6676" text-anchor="middle">
        <text x="1145" y="430">promise to pay</text>
        <text x="1145" y="445">disputed</text>
        <text x="1145" y="460">do not contact</text>
      </g>

      <path d="M1080,326 L1080,368 L735,368 L735,388" fill="none" stroke="#b8322a" stroke-width="1.4" marker-end="url(#ahD)"/>
      <text x="1010" y="361" text-anchor="middle" font-size="11" fill="#b8322a">after 3 failed attempts</text>
      <rect x="660" y="390" width="150" height="56" rx="7" fill="#ffffff" stroke="#b8322a" stroke-width="1.5"/>
      <text x="735" y="413" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">Dead-letter topic</text>
      <text x="735" y="432" text-anchor="middle" font-size="10.5" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" fill="#5d6676">….events.dlq</text>

            <path d="M925,326 L925,495 L602,495" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ah)"/>
      <text x="935" y="485" font-size="11" fill="#5d6676">event completed</text>
      <text x="935" y="420" font-size="10.5" fill="#5d6676">any outcome</text>
      <rect x="430" y="462" width="170" height="66" rx="8" fill="#ffffff" stroke="currentColor" stroke-width="1.3"/>
      <text x="515" y="485" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Offset tracker</text>
      <text x="515" y="503" text-anchor="middle" font-size="11" fill="#5d6676">commit = lowest offset</text>
      <text x="515" y="518" text-anchor="middle" font-size="11" fill="#5d6676">still in progress</text>
      <path d="M430,495 L305,495 L305,352" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ah)"/>
      <text x="315" y="420" font-size="11" fill="#5d6676">commit</text>
      <text x="315" y="434" font-size="11" fill="#5d6676">offsets</text>
    </svg>
